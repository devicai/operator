server:
  port: 3200
  basePath: /api/v1
  cors:
    enabled: true
    origins:
      - http://localhost:5174

database:
  provider: mongodb
  uri: ${DATABASE_URI:-mongodb://localhost:27017/devic-sandbox}

redis:
  url: ${REDIS_URL:-redis://localhost:6379}

# Default values applied when create / restore requests omit them.
# Shared by all runtime backends.
defaults:
  defaultImage: node:24
  defaultCpus: 1
  defaultMemoryMib: 256
  defaultTtlSeconds: 1800
  maxTtlSeconds: 7200
  ttlCheckIntervalMs: 30000
  # How close to its expiry an action must land for a sandbox created with
  # `autoExtend: true` to renew itself for another ttlSeconds. Only sandboxes
  # that asked for the flag are affected, and maxTtlSeconds still caps the total
  # lifetime, so an active sandbox does not live forever. Keep this at or above
  # ttlCheckIntervalMs, otherwise the reaper can claim the sandbox in the gap
  # between the last action and the window. Default 30.
  autoExtendWindowSeconds: 30
  # Per-command budget for the persistent shell (ms). A stuck/interactive command
  # is aborted and the shell is reset so later commands don't queue behind it
  # forever (which would surface as a gateway 504). 0 disables. Default 300000.
  # Applies to the WebSocket terminal (kept alive by keepalive pings).
  commandTimeoutMs: 300000
  # Default budget for the synchronous REST exec endpoint, kept below the ~60s
  # upstream gateway cut so a stuck command returns exit 124 instead of a 504.
  # A per-request `timeoutSeconds` overrides it; 0 disables. Default 45000.
  restCommandTimeoutMs: 45000

# Runtime backend that executes sandboxes.
#
#   microsandbox  — libkrun microVMs. Strongest isolation. Requires /dev/kvm
#                   on the host (bare metal or VPS with nested virtualization).
#
#   docker        — runs sandboxes as Docker containers. No KVM required.
#                   Use sysbox-runc on the host for production-grade isolation
#                   (https://github.com/nestybox/sysbox).
runtime:
  type: ${SANDBOX_RUNTIME:-microsandbox}

  docker:
    socketPath: /var/run/docker.sock
    runtime: sysbox-runc          # sysbox-runc | runc
    network: bridge               # used when networkPolicy=allow-all

    # Publish a sandbox port directly on the host via the `ports` map.
    # Disabled by default: public exposure goes through the ingress proxy, which
    # never needs a host port. Enable only for direct raw-TCP host publishing;
    # when enabled, host ports are validated (>1024) and bound to 127.0.0.1.
    allowHostPortPublishing: false

    # Image admission policy. The allowlist below ships populated with the common
    # Docker Official Images and major public registries. An empty list allows
    # any image. Entries match by exact repo, `prefix/` (directory) or `prefix*`.
    images:
      allowlist:
        - node
        - python
        - debian
        - ubuntu
        - alpine
        - busybox
        - bash
        - golang
        - rust
        - ruby
        - php
        - openjdk
        - eclipse-temurin
        - gcc
        - docker.io/library/*
        - mcr.microsoft.com/*
        - ghcr.io/*
        - gcr.io/*
        - public.ecr.aws/*
        - registry.k8s.io/*
        - quay.io/*
      # Reject images whose on-disk size exceeds this (bytes). 0 = no limit.
      maxSizeBytes: 0

    hardening:
      dropAllCaps: true
      noNewPrivileges: true
      readOnlyRootfs: false       # most workloads (apt, npm install) break with this
      pidsLimit: 512
      # 'default' (daemon profile) | 'unconfined' | path to a JSON profile.
      # See security/README.md. The default profile + dropped caps already block
      # most escapes; disable io_uring on the host for the main residual:
      #   echo 'kernel.io_uring_disabled = 2' | sudo tee /etc/sysctl.d/99-io_uring.conf
      seccompProfile: default
      # AppArmor profile applied to each sandbox. Skipped automatically (with a
      # warning) on hosts without AppArmor. '' or 'unconfined' to disable.
      apparmorProfile: docker-default
      # Run the sandbox as this user[:group] (e.g. '1000:1000'). Empty keeps the
      # image default (usually root). With sysbox-runc root is already remapped
      # to an unprivileged host uid; set this mainly for the plain runc fallback.
      runAsUser: ''

# Snapshots.
#   defaultScope: 'full' captures the whole filesystem diff (installed packages,
#                 /etc configs, /usr/local binaries); 'workdir' captures only the
#                 workdir. Overridable per-request.
#   compression:  'auto' (gzip) | 'zstd' (smaller, host-side) | 'gzip'.
#   cleanup:      'conservative' (default) | 'none' | 'aggressive'.
#
# Full snapshots work under BOTH runc and sysbox-runc. Under sysbox the change
# set is computed from inside the container (since `docker diff` is blind to
# sysbox's internal /usr,/etc,/lib,/var mounts); this builds a one-time per-image
# baseline manifest (a short-lived throwaway container of the base image), cached
# for subsequent snapshots of that image.
snapshots:
  defaultScope: full
  compression: auto
  cleanup: conservative
  # Keep a per-snapshot container image alongside the tarball, so restoring is
  # just "create a container" instead of replaying the tarball into one.
  # Measured on a 199.8 MB snapshot: 27.9 s -> ~2 s, and the ~2 s no longer
  # depends on snapshot size (a 760.9 MB snapshot takes 65 s from its tarball).
  #
  # The tarball stays the artifact of record: it is what export/import read,
  # what backups copy, and what the image is rebuilt from on every capture.
  # Deleting every image costs speed and nothing else — restores simply fall
  # back to the tarball, which is the behaviour without this block.
  imageCache:
    enabled: false
    repository: devic-snapshot
    # An image holds its content UNCOMPRESSED (that is why it starts
    # instantly), so it costs noticeably more than the tarball it came from:
    # measured 532 MB of unique layer against a 200 MB tar.gz. Only bytes NOT
    # shared with the base image are counted here, since the base is paid for
    # by every sandbox on the host regardless.
    #
    # When the total exceeds this, the least recently restored images are
    # dropped until it fits; images backing a live sandbox are never dropped.
    # Leave unset and the cache grows until the disk is full.
    maxTotalBytes: 21474836480  # 20 GiB
    buildTimeoutMs: 600000

# Size limits (MiB) for multipart uploads. Keep aligned with the reverse
# proxy's client_max_body_size (see frontend/nginx.conf).
uploads:
  maxSnapshotZipMb: 512
  maxFileMb: 100

# Hard caps applied module-wide (across all tenants).
# Omit a field or set it to 0 to disable that specific limit.
resourceLimits:
  # Sum of memoryMib for sandboxes in pending/creating/running/stopping state.
  # New sandboxes (and snapshot restores) are rejected when the projected total
  # would exceed this value.
  maxTotalMemoryMib: 8192
  # Sum of sizeBytes for snapshots in 'ready' state.
  # New snapshots are rejected once total disk usage reaches this value.
  maxTotalDiskBytes: 21474836480  # 20 GiB
  # Per-sandbox disk cap. Counts only the container's writable layer — what the
  # sandbox itself wrote — not the shared image. A sandbox that reaches
  # maxSandboxDiskBytes is stopped (persisted to its snapshot first, if linked)
  # with stoppedReason 'disk-limit'; warnSandboxDiskBytes only flags it.
  #
  # This is sampled on an interval, so a sandbox can overshoot between samples.
  # A kernel-enforced cap requires `--storage-opt size=`, which Docker honors
  # only on overlay2 over XFS mounted with 'pquota' — on ext4 it is rejected.
  # Omit both values (or set 0) to disable the accounting entirely.
  warnSandboxDiskBytes: 3221225472   # 3 GiB
  maxSandboxDiskBytes: 8589934592    # 8 GiB

# Pre-warmed pool of restored sandboxes, ready to be claimed instantly.
# The pool reserves a slice of `resourceLimits.maxTotalMemoryMib` proportional
# to `memoryReservePercent`. Reserved capacity (occupied by running hot sandboxes
# plus any unfilled hot slots) is unavailable for on-demand sandboxes.
#
# All values are persisted in MongoDB on first start and can be edited live
# from the frontend Settings page (changes take effect on the next reconcile).
# Cadence of the background jobs that keep the runtime and the database in
# agreement. Every value is optional — omit the block to use the defaults shown.
maintenance:
  # Reconciles the runtime against the database, reclaiming containers whose
  # sandbox is gone or in a terminal state. Lists the whole daemon, so keep it
  # well above the TTL sweep (defaults.ttlCheckIntervalMs).
  containerSweepIntervalMs: 300000   # 5 min
  # A container younger than this is never reclaimed, so a create still in
  # flight is safe even before its document exists. Must comfortably exceed the
  # slowest create on this host.
  containerSweepGraceMs: 600000      # 10 min
  # How often per-sandbox disk usage is sampled (see resourceLimits).
  sandboxDiskCheckIntervalMs: 60000  # 1 min
  # Shields a just-created per-sandbox network from the network sweeper.
  # Only relevant when ingress is enabled.
  networkSweepGraceMs: 60000         # 1 min
  # Floor applied to every interval above, so a zero or a typo cannot turn a
  # periodic job into a busy loop against the Docker daemon.
  minIntervalMs: 5000

hotPool:
  enabled: false
  # Snapshot every hot sandbox is restored from.
  snapshotId: ""
  # Percentage of maxTotalMemoryMib to reserve (0–100).
  memoryReservePercent: 25
  # Resources of each individual hot sandbox.
  memoryMibPerSandbox: 512
  cpus: 1
  # Pool sizing bounds.
  # `minSize` is the floor: at least this many pods are kept warm even if the
  # percent calculation rounds down. `maxSize` is an optional safety ceiling —
  # leave it unset to let `memoryReservePercent` × `memoryMibPerSandbox` be
  # the only cap. Set it only if you want a hard limit independent of the
  # percent reserve.
  minSize: 0
  # maxSize: 20
  # Reconcile cadence (ms).
  reconcileIntervalMs: 15000

# Public ingress — expose each running sandbox at <sandboxId>.<wildcardDomain>.
# An embedded reverse proxy listens on `proxyPort` and routes by Host header
# to the sandbox's internal HTTP port (`defaultUpstreamPort`, default 80).
#
# Security model:
#   When ingress is enabled and runtime.type=docker, every sandbox runs on
#   its own bridge network (`devic-<sandboxName>`) — sandboxes cannot reach
#   each other, mongo, redis or the api server. The `app` container is
#   transparently connected to each sandbox's bridge at publish time and
#   disconnected at unpublish, so only the proxy can route to them.
#
#   To do this `app` must be able to identify itself in Docker. By default
#   it reads `/etc/hostname` (Docker writes the container short ID there).
#   Override with the env var `DEVIC_SANDBOX_SELF_CONTAINER` if your
#   deployment changes the hostname (e.g. behind kubernetes).
#
# Operator responsibilities:
#   1. DNS: a wildcard A/AAAA record `*.<wildcardDomain>` pointing to this host.
#   2. TLS: terminated upstream (Cloudflare / CDN / external LB). The proxy
#      itself only speaks HTTP — never expose `proxyPort` directly to the
#      internet without a TLS-terminating reverse proxy in front.
ingress:
  enabled: false
  wildcardDomain: sandbox.devic.ai
  publicScheme: https
  proxyPort: 8080
  proxyHost: 0.0.0.0
  defaultUpstreamPort: 80
  upstreamTimeoutMs: 30000

  # A sandbox restored from a snapshot is published under the SNAPSHOT's
  # subdomain (its `slug`, or a label derived from its id), so the URL of a
  # service running inside it survives across sessions. Sandboxes with no
  # snapshot keep being published under their own id.
  #
  # With autoRestart on, visiting that URL while nothing is running restores
  # the snapshot and shows a waiting page until the service answers. Individual
  # snapshots opt out with their own `autoRestart: false` (PATCH /snapshots/:id).
  #
  # Note: this lets an unauthenticated visitor allocate a sandbox. It is bounded
  # by `resourceLimits` and by the short TTL below, but on a host with guessable
  # subdomains it is worth knowing about.
  autoRestart: true
  # TTL granted to a sandbox nobody explicitly asked for. Shorter than
  # defaults.defaultTtlSeconds on purpose.
  autoRestartTtlSeconds: 1800
  # How long one wake-up holds its claim before another visitor may retry.
  # Must exceed the slowest restore (a large tarball replay runs to a minute+;
  # an image-backed restore is a couple of seconds).
  autoRestartClaimSeconds: 300
  # How long the waiting page polls before showing an error.
  autoRestartTimeoutSeconds: 120

mcp:
  enabled: true

auth:
  # Set to true to require an API key on every /api/v1/* request.
  # Provide the key via SANDBOX_API_KEY in .env. The frontend Settings page
  # lets users save the same key in localStorage so it is sent automatically.
  enabled: false
  strategy: api-key
  apiKeys:
    - name: devic-backend
      key: ${SANDBOX_API_KEY:-dev-key-local}

extensions:
  properties: []
  # When integrated with Devic, uncomment:
  # properties:
  #   - name: clientUID
  #     type: string
  #     required: true
  #     index: true
  #     entities: "*"
  #     source: header
  #     headerName: x-client-uid

logging:
  level: debug
  format: pretty
