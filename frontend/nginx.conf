server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy REST API to the backend container.
    # BACKEND_URL is injected at container start via envsubst (see entrypoint).
    location /api/ {
        proxy_pass http://app:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Multipart uploads (snapshot ZIP import, file uploads) exceed the
        # 1 MB nginx default; stream them through without buffering.
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # WebSocket terminal stream.
    #
    # NOT reachable through this port. The terminal gateway authenticates
    # nobody: it registers a raw `ws.on('message')` inside handleConnection, so
    # the global ApiKeyGuard — which Nest applies to handlers — never runs on it
    # (src/terminal/terminal.gateway.ts). All an attacker needs is a sandbox id,
    # and that is public by construction: it is the label of the sandbox's own
    # ingress hostname (`<id>.<wildcardDomain>`). Sharing a preview URL would
    # mean sharing a root shell.
    #
    # Nothing legitimate loses out here: this UI runs commands over the REST
    # API, which does demand the key, and API clients (the sandboxtsc SDK) open
    # the socket straight against the API port. This block only shuts the door
    # that a browser-facing port would otherwise leave open.
    #
    # Remove the `deny all` once the gateway validates a key on connect — and
    # only then.
    location /ws/ {
        deny all;

        proxy_pass http://app:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
